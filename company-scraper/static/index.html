<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company Scraper</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232458d6'/%3E%3Cpath d='M9 24V11l7-4v17M16 24V13l7 3v8M7 24h18' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" title="All companies">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M9 24V11l7-4v17M16 24V13l7 3v8M7 24h18"/></svg>
      <span class="brand-name">Company Scraper</span>
    </a>
    <form id="omni" class="omni" role="search" autocomplete="off">
      <input id="omni-input" type="search" placeholder="Find or add a company: name or Business ID  ( / )"
             aria-label="Find or add a company" aria-autocomplete="list" aria-controls="omni-menu">
      <div id="omni-menu" class="omni-menu" role="listbox" hidden></div>
    </form>
    <div class="activity">
      <button type="button" id="activity-btn" class="activity-btn" aria-expanded="false" aria-controls="activity-menu" hidden></button>
      <div id="activity-menu" class="activity-menu" hidden></div>
    </div>
  </header>

  <div id="conn-banner" class="conn-banner" role="alert" hidden>
    Can't reach the Company Scraper server. Is its window still open? Start it again with “Start Company Scraper”.
  </div>

  <main id="main" class="main"></main>

  <div id="cite-pop" class="cite-pop" role="dialog" aria-label="Source of this statement" hidden></div>

  <script src="/static/core.js"></script>
  <script src="/static/company.js"></script>
  <script src="/static/deal.js"></script>
  <script src="/static/pipeline.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
